<app-navbar></app-navbar>

<div *ngIf="!cargando" class="p-4 pt-24 max-w-7xl mx-auto">
  <div class="mb-8 text-center">
    <button routerLink="/ciencia-ciudadana"
      class="bg-[#5F8E00] hover:bg-[#4A6A00] text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-300">
      ← Regresar a Observaciones
    </button>
  </div>

  <h1 class="text-3xl font-extrabold mb-6 text-[#866409] text-center">
    Dashboard del Proyecto
  </h1>

  <!-- Filtros CSV -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
    <div>
      <label class="block mb-2 font-semibold text-[#866409]">Institución educativa:</label>
      <select [(ngModel)]="filtroInstitucion" (change)="aplicarFiltrosCSV()" class="w-full p-2 border rounded">
        <option value="">Todas</option>
        <option *ngFor="let inst of institucionesUnicas" [value]="inst">{{ inst }}</option>
      </select>
    </div>
    <div>
      <label class="block mb-2 font-semibold text-[#866409]">Especie:</label>
      <select [(ngModel)]="filtroEspecie" (change)="aplicarFiltrosCSV()" class="w-full p-2 border rounded">
        <option value="">Todas</option>
        <option *ngFor="let esp of especiesUnicas" [value]="esp">{{ esp }}</option>
      </select>
    </div>
  </div>

  <!-- Gráficas CSV -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-[#866409]">Plantas con Hojas</h2>
      <canvas baseChart 
        [data]="{
          labels: hojasLabels,
          datasets: [{
            data: hojasData,
            backgroundColor: ['#5F8E00', '#866409']
          }]
        }"
        [type]="'doughnut'"
        [options]="chartOptionsDoughnut"
        [plugins]="chartPlugins">
      </canvas>
    </section>

    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-[#866409]">Plantas con Flores</h2>
      <canvas baseChart 
        [data]="{
          labels: floresLabels,
          datasets: [{
            data: floresData,
            backgroundColor: ['#5F8E00', '#866409']
          }]
        }"
        [type]="'doughnut'"
        [options]="chartOptionsDoughnut"
        [plugins]="chartPlugins">
      </canvas>
    </section>

    <section class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-[#866409]">Plantas con Frutos</h2>
      <canvas baseChart 
        [data]="{
          labels: frutosLabels,
          datasets: [{
            data: frutosData,
            backgroundColor: ['#5F8E00', '#866409']
          }]
        }"
        [type]="'doughnut'"
        [options]="chartOptionsDoughnut"
        [plugins]="chartPlugins">
      </canvas>
    </section>
  </div>
<h1 class="text-3xl font-extrabold mb-6 text-[#866409] text-center">
  Gráficas Destacadas
</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
  <section class="bg-white rounded-lg shadow-lg p-6 h-[400px] flex flex-col justify-between overflow-hidden">
    <h2 class="text-xl font-semibold mb-4 text-[#866409]">1. Observaciones por Usuario</h2>
    <div class="flex-grow flex items-center justify-center">
      <canvas baseChart 
        [data]="{
          labels: usuariosLabels,
          datasets: [{
            data: usuariosData,
            backgroundColor: '#5F8E00'
          }]
        }"
        [options]="chartOptionsBar"
        [plugins]="chartPlugins"
        [type]="'bar'"
        class="h-full max-h-[300px]">
      </canvas>
    </div>
  </section>

  <section class="bg-white rounded-lg shadow-lg p-6 h-[400px] flex flex-col justify-between overflow-hidden">
    <h2 class="text-xl font-semibold mb-4 text-[#866409]">2. Observaciones por Mes</h2>
    <div class="flex-grow flex items-center justify-center">
      <canvas baseChart 
        [data]="{
          labels: mesesLabels,
          datasets: [{
            data: mesesData,
            backgroundColor: '#866409'
          }]
        }"
        [options]="chartOptionsBar"
        [plugins]="chartPlugins"
        [type]="'bar'"
        class="h-full max-h-[300px]">
      </canvas>
    </div>
  </section>

  <section class="bg-white rounded-lg shadow-lg p-6 h-[400px] flex flex-col justify-between overflow-hidden">
    <h2 class="text-xl font-semibold mb-4 text-[#866409]">3. Estado de Identificación</h2>
    <div class="flex-grow flex items-center justify-center">
      <canvas baseChart 
        [data]="{
          labels: estadoIdLabels,
          datasets: [{
            data: estadoIdData,
            backgroundColor: ['#5F8E00', '#866409']
          }]
        }"
        [options]="chartOptionsDoughnut"
        [plugins]="chartPlugins"
        [type]="'doughnut'"
        class="h-full max-h-[300px]">
      </canvas>
    </div>
  </section>

  <section class="bg-white rounded-lg shadow-lg p-6 h-[400px] flex flex-col justify-between overflow-hidden">
    <h2 class="text-xl font-semibold mb-4 text-[#866409]">4. Calidad de Verificación</h2>
    <div class="flex-grow flex items-center justify-center">
      <canvas baseChart 
        [data]="{
          labels: calidadLabels,
          datasets: [{
            data: calidadData,
            backgroundColor: ['#5F8E00', '#866409', '#5F8E00']
          }]
        }"
        [options]="chartOptionsBar"
        [plugins]="chartPlugins"
        [type]="'bar'"
        class="h-full max-h-[300px]">
      </canvas>
    </div>
  </section>
</div>
